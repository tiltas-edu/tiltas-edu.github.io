name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # <owner>.github.io repos are served from the root, any other repo from /<repo>
      - name: Compute site URL
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "SITE=https://${OWNER}.github.io" >> "$GITHUB_ENV"
          if [[ "${REPO,,}" == "${OWNER,,}.github.io" ]]; then
            echo "BASE=/" >> "$GITHUB_ENV"
          else
            echo "BASE=/${REPO}" >> "$GITHUB_ENV"
          fi
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
